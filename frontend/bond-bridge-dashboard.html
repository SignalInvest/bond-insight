<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>BOND BRIDGE</title>
  <style>
    :root{--navy:#06172f;--navy2:#081d3a;--gold:#c9963e;--gold2:#d8ad60;--ivory:#faf8f2;--line:#e8dcc8;--text:#10213b;--muted:#626873;--green:#16805b;--red:#c84b3c;--white:#fff}
    *{box-sizing:border-box} body{margin:0;background:var(--ivory);color:var(--text);font-family:"Noto Sans KR",Arial,sans-serif} button,input,select{font:inherit}
    header{min-height:118px;background:var(--navy);border-bottom:3px solid var(--gold);color:var(--white);display:flex;align-items:center;justify-content:space-between;gap:40px;padding:24px 32px}
    .brand{display:flex;align-items:center;gap:18px}.mark{width:80px;height:80px;border:1px solid var(--gold);border-radius:8px;padding:16px;fill:none;stroke:var(--gold2);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
    .brand-title{margin:0;font-family:Georgia,serif;font-size:34px;letter-spacing:4px}.brand-sub{margin:6px 0 0;color:var(--gold2);font-weight:800}
    .head-right{display:flex;align-items:center;gap:28px;max-width:690px}.divider{width:1px;height:54px;background:rgba(201,150,62,.65)}
    .label{margin:0 0 7px;color:#e9e1d2;font-size:14px;font-weight:900}.summary{margin:0;font-size:14px;line-height:1.55}.datebox{display:grid;gap:6px}.datebox input{height:34px;width:160px;border:1px solid rgba(216,173,96,.7);border-radius:5px;background:rgba(255,255,255,.08);color:#fff;padding:0 9px}.datebox strong{font-size:16px}
    main{max-width:1600px;margin:0 auto;padding:24px 32px 48px}.section-title{display:flex;gap:12px;align-items:flex-start;margin-bottom:18px}.section-title>span{color:var(--gold);font-family:Georgia,serif;font-size:25px}.section-title h1,.section-title h2{margin:0;font-size:26px}.section-title p{margin:5px 0 0;color:var(--muted);font-size:13px}
    .market{display:grid;grid-template-columns:1.4fr repeat(5,1fr);gap:12px;margin-bottom:18px}.card,.panel,.market-card{background:rgba(255,255,255,.58);border:1px solid var(--line);border-radius:8px;box-shadow:0 5px 16px rgba(16,33,59,.05)}
    .market-card{min-height:125px;padding:20px}.market-card p{margin:0 0 10px;font-weight:900}.market-card strong{display:block;font-family:Georgia,serif;color:var(--navy);font-size:30px}.market-card:first-child strong{font-family:inherit;font-size:18px}.market-card span,.market-card small{display:block;margin-top:10px;color:var(--muted);font-size:12px;line-height:1.55}
    .grid{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(420px,1fr);gap:18px;align-items:start}.panel{padding:20px}.compact h2{font-size:23px}
    .quick{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}.quick button,.ai-btn{border:1px solid #d9cdb9;border-radius:18px;background:transparent;color:var(--text);padding:8px 14px;font-weight:800;cursor:pointer}.quick button.active,.ai-btn{background:var(--navy);border-color:var(--navy);color:#fff;border-radius:5px}
    .filters{display:grid;grid-template-columns:1fr 1fr 1fr 1.8fr;gap:12px;margin-bottom:18px}.filters label{display:grid;gap:7px;font-size:12px;font-weight:900}.filters select,.filters input{height:44px;border:1px solid #d9cdb9;border-radius:5px;background:rgba(255,255,255,.7);padding:0 12px}
    .table{border:1px solid #e0d5c3;border-radius:7px;overflow:hidden;background:rgba(255,255,255,.45)}.thead,.row{display:grid;grid-template-columns:1.48fr .86fr .66fr .66fr .82fr .66fr .74fr .72fr .78fr;gap:10px;align-items:center}
    .thead{background:var(--navy);color:#fff;padding:14px 16px;font-size:12px;font-weight:900}.row{width:100%;min-height:56px;border:0;border-left:3px solid transparent;border-bottom:1px solid var(--line);background:transparent;text-align:left;padding:12px 16px 12px 13px;cursor:pointer}.row:hover{background:#f7f0e3}.row.selected{background:#efe4cf;border-left-color:var(--gold)}.row span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px}.bond-name strong{display:block;overflow:hidden;text-overflow:ellipsis}.bond-name em{display:inline-block;margin:5px 5px 0 0;border:1px solid #d8c49c;border-radius:3px;color:var(--gold);font-size:10px;font-style:normal;padding:2px 5px}.pos{color:var(--green);font-weight:900}.neg{color:var(--red);font-weight:900}
    .detail-head{display:flex;align-items:flex-start;justify-content:space-between;gap:18px}.selected h3{margin:0;font-size:24px}.selected p{margin:5px 0 8px;color:var(--muted)}.tag{display:inline-block;border:1px solid #e8d2a7;color:var(--gold);border-radius:4px;padding:4px 8px;font-size:12px;font-weight:900}
    .kpis{display:grid;grid-template-columns:repeat(4,1fr);background:var(--navy);color:#fff;border-radius:8px;overflow:hidden;margin:14px 0 18px}.kpis div{padding:18px 14px;border-left:1px solid rgba(201,150,62,.65)}.kpis div:first-child{border-left:0}.kpis span{display:block;color:var(--gold2);font-size:12px;font-weight:900;margin-bottom:8px}.kpis strong{font-size:20px}
    dl{display:grid;grid-template-columns:repeat(2,1fr);gap:14px 20px;margin:0 0 18px}dt{color:#8b8f96;font-size:12px;font-weight:900}dd{margin:5px 0 0;font-weight:900}
    .chart{border:1px solid #e3d7c4;border-radius:7px;background:rgba(255,255,255,.38);padding:16px 16px 10px;margin-top:14px}.chart-head{display:flex;justify-content:space-between;gap:12px;margin-bottom:10px}.chart h4{margin:0}.chart-head span{color:#8b8f96;font-size:11px}.pill{border:1px solid #e2cfaa;border-radius:999px;color:var(--gold);font-size:11px;font-weight:900;padding:4px 8px}.gridline{stroke:#d9d2c8;stroke-width:1;stroke-dasharray:4 4;opacity:.55}.navyline,.goldline{fill:none;stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round}.navyline{stroke:var(--navy)}.goldline{stroke:var(--gold)}.dot{stroke:var(--ivory);stroke-width:1.6}.axis{fill:var(--muted);font-size:11px;text-anchor:middle}
    .empty{min-height:360px;display:grid;align-content:center;justify-items:center;text-align:center}
    .drawer-bg{position:fixed;inset:0;z-index:20;display:none;justify-content:flex-end;background:rgba(6,23,47,.36);backdrop-filter:blur(2px)}.drawer-bg.open{display:flex}.drawer{width:min(520px,100%);height:100%;overflow-y:auto;background:var(--ivory);border-left:3px solid var(--gold);box-shadow:-20px 0 46px rgba(6,23,47,.2);padding:28px}.drawer-head{display:flex;justify-content:space-between;gap:16px;margin-bottom:24px}.drawer h2{margin:4px 0 0}.drawer button{border:1px solid #d9cdb9;border-radius:5px;background:transparent;padding:8px 10px;font-weight:800}.drawer article{border-top:1px solid #e3d7c4;padding-top:14px;margin-top:16px}.drawer p{color:var(--muted);line-height:1.7}
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <svg class="mark" viewBox="0 0 64 64"><path d="M10 24h44L32 12 10 24Z"/><path d="M16 28v18M26 28v18M38 28v18M48 28v18M12 50h40"/></svg>
      <div><p class="brand-title">BOND BRIDGE</p><p class="brand-sub">채권 투자 첫걸음 대시보드</p></div>
    </div>
    <div class="head-right">
      <label class="datebox"><p class="label">기준일</p><input id="datePicker" type="date"/><strong id="dateLabel"></strong></label>
      <div class="divider"></div>
    </div>
  </header>
  <main id="app"></main>
  <div id="drawerBg" class="drawer-bg"><aside class="drawer"><div class="drawer-head"><div><p class="label" style="color:var(--gold)">AI ANALYSIS</p><h2>투자 관점 보조 분석</h2></div><button id="closeDrawer">Close</button></div><div id="drawerBody"></div></aside></div>
  <script>
    const CSV_PATH = "../data/processed/tableau_bond_dashboard.csv";
    let allBonds = [], markets = [], dates = [], selectedDate = "", selectedId = "", quick = "전체";
    const app = document.getElementById("app");
    const n = v => { const x = Number(v); return Number.isFinite(x) ? x : null; };
    const fp = v => v == null ? "데이터 미확보" : `${v.toFixed(2)}%`;
    const fnum = v => v == null ? "데이터 미확보" : Number(v).toLocaleString("ko-KR");
    const fmil = v => v == null ? "데이터 미확보" : Math.round(Number(v)/1000000).toLocaleString("ko-KR");
    const fprice = v => `${Math.round(v).toLocaleString("ko-KR")}원`;
    const fdate = v => v ? v.replaceAll("-",".") : "데이터 미확보";
    const delta = (v,u) => `${v > 0 ? "+" : ""}${v.toFixed(2)}${u}`;
    function parseCSV(t){const rows=[];let r=[],f="",q=false;for(let i=0;i<t.length;i++){const c=t[i],nx=t[i+1];if(c=='"'&&q&&nx=='"'){f+='"';i++}else if(c=='"')q=!q;else if(c==","&&!q){r.push(f);f=""}else if((c=="\n"||c=="\r")&&!q){if(c=="\r"&&nx=="\n")i++;r.push(f);if(r.some(v=>v.trim()))rows.push(r);r=[];f=""}else f+=c}if(f||r.length){r.push(f);rows.push(r)}const h=rows.shift();return rows.map(v=>Object.fromEntries(h.map((x,i)=>[x,v[i]??""])));}
    function kind(row){const name=row.bond_name||""; if(/국고|국민주택|재정|통안/.test(name))return"국채"; if(/은행|금융|카드|캐피탈/.test(name))return"금융채"; if(/회사|공사|전력|도로|토지|주택/.test(name))return"회사채"; return row.market_type||"미분류";}
    function issuer(row,k){if(k==="국채")return"대한민국 정부"; const m=(row.bond_name||"").match(/^([가-힣A-Za-z0-9]+?)(?:\d|채|[(-])/); return m?.[1]||null;}
    function mat(y){return y<1?`${Math.max(1,Math.round(y*365)).toLocaleString("ko-KR")}일`:`${y.toFixed(2)}년`;}
    function tags(b){const a=[]; if(b.kind==="국채")a.push("안정성 중심"); if(b.ytm>=4)a.push("수익률 높음"); if(b.remainingYears<3)a.push("단기"); if(b.volume>=100000000000)a.push("거래 활발"); return a;}
    const RULE_THRESHOLDS={termSpreadFlatAbs:.1,policySpreadFlatAbs:.1,rateMoveFlatAbs:.03,cpiMoveFlatAbs:.05};
    function rules(cur,prev){const out=[]; if(cur.policySpread>RULE_THRESHOLDS.policySpreadFlatAbs)out.push("POLICY_SPREAD_POSITIVE"); else if(cur.policySpread<-RULE_THRESHOLDS.policySpreadFlatAbs)out.push("POLICY_SPREAD_NEGATIVE"); else out.push("POLICY_SPREAD_FLAT"); if(cur.yieldSpread>RULE_THRESHOLDS.termSpreadFlatAbs)out.push("TERM_SPREAD_POSITIVE"); else if(cur.yieldSpread<-RULE_THRESHOLDS.termSpreadFlatAbs)out.push("TERM_SPREAD_NEGATIVE"); else out.push("TERM_SPREAD_FLAT"); if(prev){const rm=cur.treasury3y-prev.treasury3y; if(rm>RULE_THRESHOLDS.rateMoveFlatAbs)out.push("RATE_RISING"); else if(rm<-RULE_THRESHOLDS.rateMoveFlatAbs)out.push("RATE_FALLING"); else out.push("RATE_FLAT"); if(cur.cpi!=null&&prev.cpi!=null){const cm=cur.cpi-prev.cpi; if(cm>RULE_THRESHOLDS.cpiMoveFlatAbs)out.push("CPI_RISING"); else if(cm<-RULE_THRESHOLDS.cpiMoveFlatAbs)out.push("CPI_FALLING"); else out.push("CPI_FLAT")}} return out}
    function summary(cur,ruleList){const priority=["TERM_SPREAD_NEGATIVE","RATE_RISING","RATE_FALLING","TERM_SPREAD_POSITIVE","POLICY_SPREAD_POSITIVE","POLICY_SPREAD_NEGATIVE","CPI_RISING","CPI_FALLING","TERM_SPREAD_FLAT"],primary=priority.find(r=>ruleList.includes(r))||ruleList[0],lines={TERM_SPREAD_POSITIVE:`장기금리가 단기금리보다 +${cur.yieldSpread.toFixed(2)}%p 높습니다.`,TERM_SPREAD_FLAT:`장단기 금리차가 ${cur.yieldSpread.toFixed(2)}%p로 크지 않습니다.`,TERM_SPREAD_NEGATIVE:`장기금리가 단기금리보다 ${cur.yieldSpread.toFixed(2)}%p 낮습니다.`,POLICY_SPREAD_POSITIVE:`국고채 3Y가 기준금리보다 +${cur.policySpread.toFixed(2)}%p 높습니다.`,POLICY_SPREAD_NEGATIVE:`국고채 3Y가 기준금리보다 ${cur.policySpread.toFixed(2)}%p 낮습니다.`,POLICY_SPREAD_FLAT:"국고채 3Y와 기준금리의 차이가 크지 않습니다.",RATE_RISING:"이전 기준일보다 국고채 3Y 금리가 상승했습니다.",RATE_FALLING:"이전 기준일보다 국고채 3Y 금리가 하락했습니다.",RATE_FLAT:"이전 기준일 대비 국고채 3Y 금리가 보합권입니다.",CPI_RISING:"최근 CPI가 이전 월보다 상승했습니다.",CPI_FALLING:"최근 CPI가 이전 월보다 하락했습니다.",CPI_FLAT:"최근 CPI 변화가 크지 않습니다."},support=primary==="TERM_SPREAD_NEGATIVE"?"단기금리 부담이 상대적으로 크게 반영될 수 있습니다.":primary==="RATE_RISING"?"금리가 오를 때는 채권 가격 변동 가능성을 함께 봐야 합니다.":primary==="RATE_FALLING"?"금리가 내려갈 때는 기존 채권 가격에 우호적으로 작용할 수 있습니다.":"장기채는 금리 변화에 더 민감할 수 있어요."; return {summaryTitle:"오늘의 시장 요약",summaryLines:[lines[primary]||lines.TERM_SPREAD_FLAT,support],rules:ruleList}}
    function prep(rows){allBonds=rows.map((r,i)=>{const ytm=n(r.close_yield),price=n(r.close_price),rem=n(r.remaining_years),vol=n(r.volume),tv=n(r.trading_value),t3=n(r.treasury_3y),t10=n(r.treasury_10y),base=n(r.base_rate),ys=n(r.yield_spread),cs=n(r.credit_spread),ps=n(r.policy_spread); if(!r.bond_name||[ytm,price,rem,vol,tv,t3,t10,base,ys,cs,ps].some(v=>v==null))return null; const k=kind(r); const b={id:r.isin_code||r.short_code||`bond-${i}`,date:r.reference_date||r.date,bondName:r.bond_name,issuer:issuer(r,k),kind:k,rating:k==="국채"?"AAA":null,ytm,currentPrice:price,remainingYears:rem,remainingLabel:mat(rem),duration:n(r.modified_duration),volume:vol,tradingValue:tv,maturityDate:r.maturity_date,issueDate:null,couponRate:null,treasury3y:t3,treasury10y:t10,baseRate:base,yieldSpread:ys,creditSpread:cs,policySpread:ps,cpi:n(r.cpi)}; return {...b,tags:tags(b)}}).filter(Boolean).sort((a,b)=>b.tradingValue-a.tradingValue); dates=[...new Set(allBonds.map(b=>b.date))].sort(); markets=dates.map((d,i)=>{const b=allBonds.find(x=>x.date===d), prev=i>0?allBonds.find(x=>x.date===dates[i-1]):undefined, s=summary(b,rules(b,prev)); return {date:d,baseRate:b.baseRate,treasury3y:b.treasury3y,treasury10y:b.treasury10y,yieldSpread:b.yieldSpread,creditSpread:b.creditSpread,policySpread:b.policySpread,cpi:b.cpi,...s}}); selectedDate=dates.at(-1)||""; document.getElementById("datePicker").value=selectedDate; render();}
    function current(){return {bonds:allBonds.filter(b=>b.date===selectedDate),market:markets.find(m=>m.date===selectedDate)}}
    function render(){const {bonds,market}=current(); document.getElementById("dateLabel").textContent=`${fdate(selectedDate)} 기준`; if(!market||!bonds.length){app.innerHTML=`<section class="empty card"><h1>${fdate(selectedDate)} 기준 데이터가 없습니다.</h1><p>사용 가능한 기준일: ${dates.map(fdate).join(", ")}</p></section>`;return} const selected=bonds.find(b=>b.id===selectedId)||bonds[0]; selectedId=selected.id; const filtered=bonds.filter(b=>quick==="전체"||quick==="국채"&&b.kind==="국채"||quick==="회사채"&&b.kind!=="국채"||quick==="안정성 중심"&&b.tags.includes("안정성 중심")||quick==="수익률 중심"&&b.tags.includes("수익률 높음")||quick==="단기채"&&b.remainingYears<3);
      app.innerHTML=`<section><div class="section-title"><span>01</span><div><h1>BOND MARKET</h1><p>지금 채권시장은 어떤 상황일까요?</p></div></div><div class="market">${marketCard(market.summaryTitle,market.summaryLines[0],market.summaryLines[1])}${marketCard("기준금리",fp(market.baseRate),"정책금리 기준")}${marketCard("국고채 3Y",fp(market.treasury3y),`Policy Spread ${delta(market.policySpread,"%p")}`)}${marketCard("국고채 10Y",fp(market.treasury10y),"시장금리 기준")}${marketCard("장단기 금리차",delta(market.yieldSpread,"%p"),"10Y - 3Y")}${marketCard("CPI",market.cpi?.toFixed(2)||"데이터 미확보","최근 월 기준")}</div></section>
      <div class="grid"><section class="panel"><div class="section-title compact"><span>02</span><div><h2>BOND SCREENER</h2><p>조건을 선택하거나 검색하여 관심 채권을 찾아보세요.</p></div></div><div class="quick">${["전체","국채","회사채","안정성 중심","수익률 중심","단기채"].map(q=>`<button data-q="${q}" class="${q===quick?"active":""}">${q}</button>`).join("")}</div><div class="filters"><label>채권 종류<select><option>전체</option></select></label><label>신용등급<select><option>전체</option></select></label><label>잔존만기<select><option>전체</option></select></label><label>채권명 검색<input placeholder="채권명 또는 종목코드 입력"></label></div><div class="table"><div class="thead"><span>채권명</span><span>발행기관</span><span>종류</span><span>신용등급</span><span>만기수익률</span><span>표면금리</span><span>잔존만기</span><span>듀레이션</span><span>현재가</span></div>${filtered.map(row).join("")}</div></section>${detail(selected,market)}</div>`;
      document.querySelectorAll("[data-q]").forEach(x=>x.onclick=()=>{quick=x.dataset.q;render()}); document.querySelectorAll("[data-id]").forEach(x=>x.onclick=()=>{selectedId=x.dataset.id;render()}); document.getElementById("aiOpen").onclick=()=>openAi(selected,market);}
    function marketCard(l,v,s,small=""){return `<article class="market-card"><p>${l}</p><strong>${v}</strong><span>${s}</span>${small?`<small>${small}</small>`:""}</article>`}
    function row(b){return `<button class="row ${b.id===selectedId?"selected":""}" data-id="${b.id}"><span class="bond-name"><strong>${b.bondName}</strong>${b.tags.slice(0,2).map(t=>`<em>${t}</em>`).join("")}</span><span>${b.issuer||"데이터 미확보"}</span><span>${b.kind}</span><span>${b.rating||"데이터 미확보"}</span><span class="${b.ytm>=b.treasury3y?"pos":"neg"}">${fp(b.ytm)}</span><span>데이터 미확보</span><span>${b.remainingLabel}</span><span>${b.duration==null?"데이터 미확보":b.duration.toFixed(3)}</span><span>${fprice(b.currentPrice)}</span></button>`}
    function detail(b,m){const trend=trendSvg(b), comp=compSvg(b,m);return `<section class="panel"><div class="detail-head"><div class="section-title compact"><span>03</span><div><h2>BOND OVERVIEW</h2><p>좌측에서 채권을 선택하면 상세 정보가 표시됩니다.</p></div></div><button id="aiOpen" class="ai-btn">AI Analysis</button></div><div class="selected"><h3>${b.bondName}</h3><p>${b.kind} · ${b.rating||"신용등급 데이터 미확보"}</p><div class="tag">${b.tags[0]||"태그 산출 기준 TODO"}</div></div><div class="kpis"><div><span>만기수익률</span><strong>${fp(b.ytm)}</strong></div><div><span>현재가격</span><strong>${fprice(b.currentPrice)}</strong></div><div><span>잔존만기</span><strong>${b.remainingLabel}</strong></div><div><span>신용등급</span><strong>${b.rating||"미확보"}</strong></div></div><dl><div><dt>발행기관</dt><dd>${b.issuer||"데이터 미확보"}</dd></div><div><dt>표면금리</dt><dd>데이터 미확보</dd></div><div><dt>발행일</dt><dd>데이터 미확보</dd></div><div><dt>만기일</dt><dd>${fdate(b.maturityDate)}</dd></div><div><dt>듀레이션</dt><dd>${b.duration==null?"산출 데이터 없음":b.duration.toFixed(3)}</dd></div><div><dt>거래량(백만)</dt><dd>${fmil(b.volume)}</dd></div></dl>${trend}${comp}</section>`}
    function trendSvg(b){const base=b.currentPrice,c=Math.abs(base*.006),vals=[base-c*.4,base+c*.15,base-c*.2,base+c*.35,base],min=Math.min(...vals),max=Math.max(...vals),pts=vals.map((v,i)=>({x:30+i*92,y:142-((v-min)/Math.max(max-min,1))*98})),path=pts.map((p,i)=>`${i?"L":"M"} ${p.x} ${p.y}`).join(" ");return `<div class="chart"><div class="chart-head"><div><h4>선택 채권 가격 추이</h4><span>현재 CSV는 단일 기준일 데이터라 시계열 연결 TODO</span></div><p class="pill">Price</p></div><svg viewBox="0 0 440 180"><path d="M28 146 H416 M28 92 H416 M28 38 H416" class="gridline"/><path d="${path}" class="navyline"/>${pts.map((p,i)=>`<circle class="dot" fill="#06172f" cx="${p.x}" cy="${p.y}" r="3.8"/><text class="axis" x="${p.x}" y="169">${i===4?"현재":"T-"+(4-i)}</text>`).join("")}</svg></div>`}
    function compSvg(b,m){const vals=[["기준금리",m.baseRate],["국고 3Y",m.treasury3y],["국고 10Y",m.treasury10y],["선택 만기수익률",b.ytm]],min=Math.min(...vals.map(v=>v[1]))-.3,max=Math.max(...vals.map(v=>v[1]))+.3,pts=vals.map((v,i)=>({label:v[0],x:34+i*112,y:140-((v[1]-min)/(max-min))*98})),path=pts.map((p,i)=>`${i?"L":"M"} ${p.x} ${p.y}`).join(" ");return `<div class="chart"><div class="chart-head"><div><h4>시장금리와 선택 채권 비교</h4><span>국고채 3Y vs 선택 만기수익률</span></div><p class="pill">수익률</p></div><svg viewBox="0 0 390 180"><path d="M34 146 H366 M34 92 H366 M34 38 H366" class="gridline"/><text class="axis" x="10" y="42">높음</text><text class="axis" x="10" y="148">낮음</text><path d="${path}" class="goldline"/>${pts.map(p=>`<circle class="dot" fill="#c9963e" cx="${p.x}" cy="${p.y}" r="3.8"/><text class="axis" x="${p.x}" y="169">${p.label.replace("금리","")}</text>`).join("")}</svg></div>`}
    function openAi(b,m){const extra=b.ytm-m.treasury3y,dur=b.duration==null?"듀레이션 산출 데이터가 없어":`듀레이션 ${b.duration.toFixed(2)}년 기준`;document.getElementById("drawerBody").innerHTML=`<h3>선택 채권의 만기수익률은 ${b.ytm.toFixed(2)}%이고 국고채 3Y 대비 ${delta(extra,"%p")} 차이를 보입니다.</h3><article><strong>수익률 관점</strong><p>현재 만기수익률 ${b.ytm.toFixed(2)}%와 기준금리 ${m.baseRate.toFixed(2)}% 사이의 간격을 함께 볼 수 있습니다.</p></article><article><strong>위험 관점</strong><p>${dur} 시장금리 변동에 따른 가격 민감도를 확인해야 합니다. 잔존만기는 ${b.remainingLabel}입니다.</p></article><article><strong>확인할 점</strong><p>거래량은 ${fmil(b.volume)}백만 단위이며, 신용등급 또는 표면금리처럼 CSV에 없는 항목은 추가 데이터 연결 후 판단 범위를 넓힐 수 있습니다.</p></article>`;document.getElementById("drawerBg").classList.add("open")}
    document.getElementById("closeDrawer").onclick=()=>document.getElementById("drawerBg").classList.remove("open");
    document.getElementById("drawerBg").onclick=e=>{if(e.target.id==="drawerBg")e.currentTarget.classList.remove("open")};
    document.getElementById("datePicker").onchange=e=>{selectedDate=e.target.value;selectedId="";render()};
    fetch(CSV_PATH).then(r=>r.text()).then(t=>prep(parseCSV(t))).catch(err=>{app.innerHTML=`<section class="empty card"><h1>CSV를 불러오지 못했습니다.</h1><p>${CSV_PATH} 경로를 로컬 서버에서 열어주세요.</p></section>`;console.error(err)});
  </script>
</body>
</html>
